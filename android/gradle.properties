org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Run Kotlin compiler in-process to avoid daemon RMI/Connection-reset crashes
# on Windows that we hit with the default out-of-process daemon.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx2G,-XX:MaxMetaspaceSize=512m
kotlin.incremental=false
